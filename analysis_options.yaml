
analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    - ios/**
    - macos/**
    - linux/**
    - packages/flutter_tesseract_ocr/**
  errors:
    deprecated_member_use: ignore

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    avoid_print: true
    prefer_single_quotes: true
