
group 'io.paratoner.flutter_tesseract_ocr'
version '1.0'

rootProject.allprojects {
    repositories {
        flatDir {
            dirs project(':flutter_tesseract_ocr').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "io.paratoner.flutter_tesseract_ocr"
    // AGP 9: الـ DSL القديم (compileSdkVersion / minSdkVersion / lintOptions)
    // اتشال نهائيًا — الصيغة الحديثة هي compileSdk / minSdk
    compileSdk 36

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    api(name: 'tesseract4android-release', ext: 'aar')
}

